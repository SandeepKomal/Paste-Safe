<!doctype html>
<!--
  The film on the home page, drawn as a web page so it can be rendered frame by
  frame. render.mjs opens this file, calls render(t) for each frame and saves
  the frames; ffmpeg turns them into video. Nothing here ships. Open it in a
  browser to watch it play in real time.

  The page shows the film behind a brush-stroke stencil (stroke.html), so the
  film has no captions of its own and loops without a cut.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paste-Safe film</title>
<style>
  :root {
    --ink: #1d1d1f; --muted: #6e6e73; --faint: #86868b; --rule: #e5e5ea;
    --label-bg: #ececf0; --raw-ink: #3a3a3c; --raw-line: #b0b0b6; --soft: #f5f5f7;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #e4e4e9; overflow: hidden; }
  body { font-family: Inter, system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage { position: fixed; inset: 0; --u: calc(min(100vw, 100vh) / 1080); font-size: calc(var(--u) * 16); }
  .layer { position: absolute; left: 50%; top: 50%; will-change: transform, opacity; }

  .plate {
    display: flex; gap: calc(var(--u) * 26); padding: calc(var(--u) * 30);
    border-radius: calc(var(--u) * 46); background: linear-gradient(180deg, #f2f2f5, #e4e4e9);
    box-shadow: 0 calc(var(--u) * 14) 0 #d6d6dc, 0 calc(var(--u) * 50) calc(var(--u) * 80) calc(var(--u) * -20) rgb(0 0 0 / 22%), inset 0 calc(var(--u) * 2) 0 #fff;
  }
  .key {
    display: grid; place-items: center; height: calc(var(--u) * 196); border-radius: calc(var(--u) * 30);
    background: linear-gradient(180deg, #fff, #f7f7f9); color: #6e6e73;
    font: 300 calc(var(--u) * 64)/1 Inter, sans-serif; letter-spacing: -.01em;
    box-shadow: 0 calc(var(--u) * var(--depth, 12)) 0 #cfcfd6, 0 calc(var(--u) * 16) calc(var(--u) * 26) rgb(0 0 0 / 10%), inset 0 calc(var(--u) * -2) 0 #ececf0;
    transform: translateY(calc(var(--u) * (12 - var(--depth, 12))));
  }
  .key--wide { width: calc(var(--u) * 290); }
  .key--sq { width: calc(var(--u) * 196); }

  .win {
    width: calc(var(--u) * var(--w, 1240)); border: 1px solid var(--rule); border-radius: calc(var(--u) * 30); background: #fff; overflow: hidden;
    box-shadow: 0 calc(var(--u) * 70) calc(var(--u) * 120) calc(var(--u) * -40) rgb(0 0 0 / 24%), 0 calc(var(--u) * 3) calc(var(--u) * 10) rgb(0 0 0 / 5%);
  }
  .win__bar { display: flex; align-items: center; gap: calc(var(--u) * 12); padding: calc(var(--u) * 22) calc(var(--u) * 28); background: #fafafc; border-bottom: 1px solid var(--rule); }
  .win__bar i { width: calc(var(--u) * 18); height: calc(var(--u) * 18); border-radius: 50%; background: #e0e0e5; }
  .win__bar span { margin-left: calc(var(--u) * 14); color: var(--muted); font: 500 calc(var(--u) * 22)/1 "JetBrains Mono", monospace; }
  .win__bar b { margin-left: auto; padding: calc(var(--u) * 8) calc(var(--u) * 18); border-radius: 99px; background: var(--ink); color: #fff; font: 600 calc(var(--u) * 22)/1 Inter, sans-serif; font-variant-numeric: tabular-nums; }
  .win pre { padding: calc(var(--u) * 36) calc(var(--u) * 40) calc(var(--u) * 42); color: #48484a; font: 400 calc(var(--u) * var(--code, 30))/2.05 "JetBrains Mono", monospace; white-space: pre; }
  .win pre .c { color: #a1a1a6; }
  .win pre div { opacity: var(--in, 1); transform: translateY(calc(var(--u) * (1 - var(--in, 1)) * 14)); }

  /* A secret that turns into a label: both sit in one cell whose width moves between them. */
  .sw { display: inline-grid; vertical-align: top; width: var(--cw); }
  .sw > * { grid-area: 1 / 1; justify-self: start; white-space: pre; }
  .sw .raw { color: var(--raw-ink); border-radius: calc(var(--u) * 6); outline: calc(var(--u) * 2) dashed var(--raw-line); outline-offset: calc(var(--u) * -2); padding-inline: calc(var(--u) * 4); opacity: calc(1 - var(--k)); filter: blur(calc(var(--u) * var(--k) * 8)); }
  .sw .lab { justify-self: start; color: var(--ink); font-weight: 700; border-radius: calc(var(--u) * 8); background: var(--label-bg); padding-inline: calc(var(--u) * 8); opacity: var(--k); transform: scale(calc(.92 + var(--k) * .08)); }
  .sw .val { color: var(--ink); font-weight: 500; box-shadow: inset 0 calc(var(--u) * -3) 0 var(--ink); border-radius: calc(var(--u) * 4); background: var(--soft); padding-inline: calc(var(--u) * 6); opacity: var(--k); }
  .sw.back .lab { opacity: calc(1 - var(--k)); filter: blur(calc(var(--u) * var(--k) * 8)); transform: none; }

  .chat { display: grid; gap: calc(var(--u) * 26); padding: calc(var(--u) * 40) calc(var(--u) * 40) calc(var(--u) * 46); font: 400 calc(var(--u) * var(--code, 30))/1.9 "JetBrains Mono", monospace; }
  .bubble { padding: calc(var(--u) * 22) calc(var(--u) * 30); border-radius: calc(var(--u) * 28); white-space: pre; opacity: var(--in, 1); transform: translateY(calc(var(--u) * (1 - var(--in, 1)) * 24)); }
  .bubble small { display: block; margin-bottom: calc(var(--u) * 6); color: var(--faint); font: 600 calc(var(--u) * 20)/1.4 Inter, sans-serif; letter-spacing: .04em; text-transform: uppercase; }
  .bubble--you { justify-self: end; background: var(--soft); }
  .bubble--ai { justify-self: start; border: 1px solid var(--rule); }
  .bubble .lab { color: var(--ink); font-weight: 700; border-radius: calc(var(--u) * 8); background: var(--label-bg); padding-inline: calc(var(--u) * 8); }

  /* Each scene fills the frame in light grey. The page shows the film through a brush-stroke
     stencil, so the grey reads as paint on the white page. */
  .scene { position: absolute; inset: 0; }
  #sceneKeys { background: radial-gradient(120% 90% at 30% 15%, #f2f2f5, #e4e4e9 55%, #d8d8de); }
  #sceneLog { background: radial-gradient(120% 90% at 75% 20%, #efeff2, #e0e0e5 55%, #d4d4da); }
  #sceneChat { background: radial-gradient(120% 90% at 50% 0%, #f0f0f3, #e2e2e7 55%, #d6d6dc); }
</style>
</head>
<body>
<div id="stage">
  <div class="scene" id="sceneKeys">
    <div class="layer" id="plateC">
      <div class="plate"><div class="key key--wide" id="ctrl1">Ctrl</div><div class="key key--sq" id="keyC">C</div></div>
    </div>
    <div class="layer" id="plateV">
      <div class="plate"><div class="key key--wide" id="ctrl2">Ctrl</div><div class="key key--sq" id="keyV">V</div></div>
    </div>
  </div>

  <div class="scene" id="sceneLog">
    <div class="layer" id="log">
      <div class="win">
        <div class="win__bar"><i></i><i></i><i></i><span>deploy-error.log</span><b id="count">0 hidden</b></div>
        <pre id="logText"><div><span class="c">09:12:44Z</span> connecting to orders db</div><div>  host=<s data-sw="prod-db.internal|[HOST_1]"></s></div><div>  user=app password=<s data-sw="Tr0ub4dor&amp;3xyz|[DB_PASSWORD_1]"></s></div><div><span class="c">09:12:49Z</span> ERROR timeout from <s data-sw="10.20.4.17|[IP_1]"></s></div><div>AWS_ACCESS_KEY_ID=<s data-sw="AKIAIOSFODNN7EXAMPLE|[AWS_KEY_1]"></s></div><div>alert sent to <s data-sw="ops@acme-pay.io|[EMAIL_1]"></s></div></pre>
      </div>
    </div>
  </div>

  <div class="scene" id="sceneChat">
    <div class="layer" id="chat">
      <div class="win">
        <div class="win__bar"><i></i><i></i><i></i><span>any AI chat</span></div>
        <div class="chat">
          <div class="bubble bubble--you" id="ask"><small>You</small>Why does <span class="lab">[HOST_1]</span> time out
from <span class="lab">[IP_1]</span>?</div>
          <div class="bubble bubble--ai" id="reply"><small>AI</small><s data-sw="[HOST_1]|prod-db.internal" data-back></s> blocks <s data-sw="[IP_1]|10.20.4.17" data-back></s>.
Allow it in the firewall,
then retry with <s data-sw="[DB_PASSWORD_1]|Tr0ub4dor&amp;3xyz" data-back></s>.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // The timeline below is written in beats; PACE stretches it to the film's real length.
  const BEATS = 15;
  const PACE = 1.6;
  const $ = s => document.querySelector(s);
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const span = (t, a, b) => clamp((t - a) / (b - a));
  const ease = x => (x < .5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2);
  const out = x => 1 - (1 - x) ** 3;
  const back = x => 1 + 2.2 * (x - 1) ** 3 + 1.2 * (x - 1) ** 2;
  const lerp = (a, b, k) => a + (b - a) * k;
  /** A key press between a and a+.32s: down fast, back up softly. */
  const press = (t, a) => (t < a ? 0 : t < a + .08 ? (t - a) / .08 : 1 - out(span(t, a + .14, a + .34)));

  // Build the secret/label cells and measure both widths once.
  const cells = [...document.querySelectorAll("s[data-sw]")].map(s => {
    const [from, to] = s.dataset.sw.split("|");
    const restores = s.hasAttribute("data-back");
    const el = document.createElement("span");
    el.className = restores ? "sw back" : "sw";
    for (const [cls, text] of restores ? [["lab", from], ["val", to]] : [["raw", from], ["lab", to]]) {
      const part = document.createElement("span");
      part.className = cls;
      part.textContent = text;
      el.append(part);
    }
    s.replaceWith(el);
    return { el, back: restores };
  });
  const measure = () => {
    for (const c of cells) c.w = [...c.el.children].map(x => x.offsetWidth);
  };

  const portrait = () => innerHeight > innerWidth;
  const u = () => Math.min(innerWidth, innerHeight) / 1080;
  const place = (el, x, y, s = 1, r = 0, o = 1) => {
    el.style.transform = `translate(-50%, -50%) translate(${x * u()}px, ${y * u()}px) rotate(${r}deg) scale(${s})`;
    el.style.opacity = o;
  };

  function layout() {
    const p = portrait();
    $("#stage").style.setProperty("--w", p ? 880 : 1180);
    $("#stage").style.setProperty("--code", p ? 31 : 38);
    measure();
  }

  function draw(t) {
    const p = portrait();
    // Scenes cross-fade: keys, then the log, then the chat, then back to the
    // empty keys scene so the loop has no cut.
    $("#sceneLog").style.opacity = ease(span(t, 3.9, 4.5)) * (1 - ease(span(t, 13.6, 14.6)));
    $("#sceneChat").style.opacity = ease(span(t, 8.0, 8.6)) * (1 - ease(span(t, 13.6, 14.6)));

    // The two key plates drop in and get pressed.
    const plate = (el, a, x, y, r) => {
      const k = back(span(t, a, a + .75));
      // Hidden again by the time the chat fades back to this scene, so the loop starts empty.
      place(el, x, lerp(y + 240, y, k), lerp(.72, 1, k), lerp(r - 18, r, k), t < 12 ? out(span(t, a, a + .3)) : 0);
    };
    // Ctrl C starts in the middle and makes room when Ctrl V arrives.
    const room = ease(span(t, 1.75, 2.5));
    plate($("#plateC"), .3, p ? 0 : lerp(0, -330, room), p ? lerp(0, -170, room) : -10, p ? -5 : -6);
    plate($("#plateV"), 1.9, p ? 20 : 330, p ? 170 : 10, p ? 4 : 5);
    const depth = (el, a) => el.style.setProperty("--depth", 12 - press(t, a) * 10);
    depth($("#ctrl1"), 1.25); depth($("#keyC"), 1.37);
    depth($("#ctrl2"), 2.85); depth($("#keyV"), 2.97);

    // The log is pasted in, then its secrets turn into labels one by one.
    const logIn = out(span(t, 4.2, 5.0));
    place($("#log"), 0, (1 - logIn) * 60, lerp(.96, 1, logIn), 0, 1);
    [...$("#logText").children].forEach((line, i) => line.style.setProperty("--in", out(span(t, 4.45 + i * .07, 4.85 + i * .07))));
    let hidden = 0;
    cells.filter(c => !c.back).forEach((c, i) => {
      const k = ease(span(t, 5.3 + i * .5, 5.75 + i * .5));
      if (k > .5) hidden++;
      c.el.style.setProperty("--k", k);
      c.el.style.setProperty("--cw", `${lerp(c.w[0], c.w[1], k)}px`);
    });
    $("#count").textContent = `${hidden} hidden`;

    // The AI chat: the question goes out with labels, the reply comes back and is restored.
    const chatIn = out(span(t, 8.3, 9.0));
    place($("#chat"), 0, (1 - chatIn) * 60, lerp(.96, 1, chatIn), 0, 1);
    $("#ask").style.setProperty("--in", out(span(t, 8.75, 9.3)));
    $("#reply").style.setProperty("--in", out(span(t, 9.5, 10.05)));
    cells.filter(c => c.back).forEach((c, i) => {
      const k = ease(span(t, 11.0 + i * .4, 11.45 + i * .4));
      c.el.style.setProperty("--k", k);
      c.el.style.setProperty("--cw", `${lerp(c.w[0], c.w[1], k)}px`);
    });
  }

  window.render = t => draw(t / PACE);
  window.DURATION = BEATS * PACE;
  window.ready = document.fonts.ready.then(layout);
  addEventListener("resize", () => { layout(); });
  if (!navigator.webdriver) {
    ready.then(() => {
      const start = performance.now();
      const tick = now => { window.render(((now - start) / 1000) % window.DURATION); requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
    });
  }
</script>
</body>
</html>
