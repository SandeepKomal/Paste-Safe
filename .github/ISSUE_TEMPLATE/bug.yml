name: Something isn't working
description: A bug in the page itself.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the page\n2. Paste ...\n3. ..."
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Chrome 140 on Windows, Safari on iPhone
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options: [Board, Lens, Sticker]
