name: A secret wasn't hidden
description: Paste-Safe left something sensitive in the safe text.
labels: [detector]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste a real secret here.** Issues are public. Change every character you can while keeping the shape, for example `sk_live_` followed by made-up letters.
  - type: input
    id: kind
    attributes:
      label: What kind of secret is it?
      placeholder: e.g. Datadog API key, Azure SAS token
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: A fake example in the same format
      description: Include the text around it, like the setting name or header.
      render: text
    validations:
      required: true
  - type: input
    id: docs
    attributes:
      label: Link to the provider's docs on this format (if you have one)
