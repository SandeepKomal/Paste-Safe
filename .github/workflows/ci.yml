name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    # A normal run takes about eight minutes; a hung step fails the job instead of running for hours.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browser install sometimes hangs on a slow package mirror; fail it in minutes, not hours.
      - name: Install browsers
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 1

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: paste-safe-visual-audit
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 2
