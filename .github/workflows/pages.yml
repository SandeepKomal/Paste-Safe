name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      # The workflow token can't turn Pages on, so when it's off, skip the deploy with a
      # clear warning instead of failing. Any answer other than 404 goes on to deploy,
      # so real errors still surface in configure-pages.
      - name: Check that GitHub Pages is turned on
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API answered HTTP $status"
          if [ "$status" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages is off::Tests passed but nothing was deployed. Turn Pages on in Settings → Pages → Source: GitHub Actions, then re-run this workflow."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/configure-pages@v6
        if: steps.pages.outputs.enabled == 'true'

      - name: Assemble site
        if: steps.pages.outputs.enabled == 'true'
        run: |
          mkdir -p _site
          cp -r index.html sw.js manifest.webmanifest css src assets _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v4
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: _site

      - name: Deploy
        id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v5
